[project]
name = "test-marimo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "abdamsab", email = "abdamsabinfo@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "marimo>=0.24.0",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.12",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
test-marimo = "test_marimo:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

# TUR PyPI: pre-built wheels for Termux (aarch64-linux-android)
# uv does NOT read pip.conf — index must be declared here.
[[tool.uv.index]]
url = "https://termux-user-repository.github.io/pypi/"
name = "tur-pypi"
